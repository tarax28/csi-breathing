name: Build

# Every push to master builds all three platforms (downloadable as run artifacts).
# Pushing a tag like v0.1.0 also publishes them as a GitHub release.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - name: Package
        run: |
          ./target/release/csi-breathing selftest
          mkdir dist
          tar -C target/release -czf dist/csi-breathing-linux-x64.tar.gz csi-breathing
      - uses: actions/upload-artifact@v7
        with:
          name: csi-breathing-linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          ./target/release/csi-breathing.exe selftest
          mkdir dist
          cp target/release/csi-breathing.exe dist/csi-breathing-windows-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: csi-breathing-windows
          path: dist/*

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Make the universal app bundle
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          app="dist/CSI Breathing.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/csi-breathing" \
            target/aarch64-apple-darwin/release/csi-breathing \
            target/x86_64-apple-darwin/release/csi-breathing
          sed "s/VERSION/$version/" macos/Info.plist > "$app/Contents/Info.plist"
          # ad-hoc signature: Apple Silicon refuses to run unsigned code
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          lipo -info "$app/Contents/MacOS/csi-breathing"
          "$app/Contents/MacOS/csi-breathing" selftest
          ditto -c -k --keepParent "$app" dist/csi-breathing-macos-universal.zip
          rm -r "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: csi-breathing-macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
