# Link libunwind (and the rest of the llvm-mingw runtime) statically, so the Windows exe
# does not need libunwind.dll next to it.
[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

# Same for the MSVC build (CI): no Visual C++ redistributable needed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
